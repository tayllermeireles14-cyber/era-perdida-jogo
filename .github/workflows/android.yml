name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Package JSON and Folders
        run: |
          mkdir -p www
          # Cria o arquivo de configuração que o Capacitor exige
          echo '{"name": "eraperdida", "version": "1.0.0", "dependencies": {"@capacitor/core": "^6.0.0", "@capacitor/android": "^6.0.0"}}' > package.json
          
          # Move o seu arquivo de jogo (com qualquer nome) para a pasta certa
          mv *.html www/index.html || true
          if [ -f index.html ]; then mv index.html www/; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli@6
          npx cap init "Era Perdida" "com.seujogo.eraperdida" --web-dir=www --confirm
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EraPerdida-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        
