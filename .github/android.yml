name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Organize Folders
        run: |
          mkdir -p www
          if [ -f index.html ]; then mv index.html www/; fi
          if [ -f main.html ]; then mv main.html www/index.html; fi
          if [ -f jogo.html ]; then mv jogo.html www/index.html; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Era Perdida" "com.seujogo.eraperdida" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EraPerdida-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
